version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tamarac
      POSTGRES_PASSWORD: tamarac
      POSTGRES_DB: tamarac
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamarac"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tamarac:tamarac@postgres:5432/tamarac
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    working_dir: /app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host

  # ── Demo / development only ─────────────────────────────────────────────────
  # A lightweight FastAPI server that mimics the Salesforce REST API.
  # Used when DEMO_MODE=true so the app works with zero external dependencies.
  mock-sf:
    build:
      context: ./apps/mock-sf
    restart: unless-stopped
    ports:
      - "8888:8888"
    profiles:
      - demo

volumes:
  postgres_data:
